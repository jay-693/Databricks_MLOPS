resources:
  jobs:
    fraud_ingestion_job:
      name: fraud_ingestion_job

      tasks:
        - task_key: ingest_raw_data

          notebook_task:
            notebook_path: ../src/ingestion.py

            base_parameters:
              batch_id: "{{job.start_time.iso_date}}"
              catalog: ${var.catalog}

      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: "UTC"
        pause_status: PAUSED
