logistic_regression:
  max_iter: [1000]
  C: [0.1, 1.0, 10.0]
  class_weight: [null, "balanced"]

random_forest:
  n_estimators: [200, 300]
  max_depth: [16, 24, null]
  min_samples_leaf: [1, 3]
  class_weight: [null, "balanced_subsample", { 0: 1, 1: 20 }]

# Replaces sklearn's GradientBoostingClassifier: much faster on millions of rows.
# class_weight needs scikit-learn >= 1.2.
hist_gradient_boosting:
  max_iter: [200, 400]
  learning_rate: [0.05, 0.1]
  max_depth: [6, 8]
  min_samples_leaf: [20, 100]
  class_weight: [null, { 0: 1, 1: 20 }]
